            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6ec6ff, #0b3c8a);

        .container {
            text-align: center;

        .title {

            color: #333;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            user-select: all;
        }

</head>
<body>
    <div class="container">
        <div class="title">Copy Code</div>
